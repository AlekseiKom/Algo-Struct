<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e234e"/>
      <stop offset="50%" stop-color="#0a1532"/>
      <stop offset="100%" stop-color="#050b1a"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base tile (squircle), Deep Ambient Sapphire -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>

  <!-- Big O: ring cyan -> blue -> violet -->
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="url(#oGrad)" stroke-width="5" filter="url(#neon)"/>

  <!-- Graph inside the O: three connected nodes -->
  <g stroke="rgba(147,197,253,0.55)" stroke-width="1.6">
    <line x1="32" y1="24" x2="25" y2="38"/>
    <line x1="32" y1="24" x2="39" y2="38"/>
    <line x1="25" y1="38" x2="39" y2="38"/>
  </g>
  <circle cx="32" cy="24" r="3.4" fill="#0f2654" stroke="#38bdf8" stroke-width="1.8" filter="url(#neon)"/>
  <circle cx="25" cy="38" r="2.9" fill="#0f2654" stroke="#60a5fa" stroke-width="1.8" filter="url(#neon)"/>
  <circle cx="39" cy="38" r="2.9" fill="#0f2654" stroke="#c084fc" stroke-width="1.8" filter="url(#neon)"/>

  <!-- Center accent -->
  <circle cx="32" cy="32.6" r="1.7" fill="#ffffff" opacity="0.9"/>
</svg>