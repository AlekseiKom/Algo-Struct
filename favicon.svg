<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e234e" />
      <stop offset="50%" stop-color="#0a1532" />
      <stop offset="100%" stop-color="#050b1a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Tile with iOS-style squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />

  <!-- Binary Tree Edges (root -> children) -->
  <g stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#neon)">
    <line x1="32" y1="20" x2="20" y2="42" />
    <line x1="32" y1="20" x2="44" y2="42" />
  </g>

  <!-- Root Node -->
  <circle cx="32" cy="20" r="7" fill="#0f2654" stroke="#38bdf8" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="32" cy="20" r="2.8" fill="#38bdf8" />

  <!-- Left Child Node -->
  <circle cx="20" cy="42" r="6" fill="#0f2654" stroke="#60a5fa" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="20" cy="42" r="2.2" fill="#60a5fa" />

  <!-- Right Child Node (violet accent) -->
  <circle cx="44" cy="42" r="6" fill="#0f2654" stroke="#a855f7" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="44" cy="42" r="2.2" fill="#c084fc" />

  <!-- Data Packet Accents (on the edges) -->
  <circle cx="26.5" cy="30" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="37.5" cy="30" r="1.5" fill="#38bdf8" opacity="0.9" />
</svg>
